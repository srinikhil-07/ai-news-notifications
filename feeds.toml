# AI news sources from tech company and AI startup blogs.
#
# Fields for each [[feeds]] entry:
#   name          (required) Display name in the digest.
#   url           (required) RSS/Atom feed URL, or listing page URL for type = "html".
#   type          "rss" (default) or "html" for blogs without a feed.
#   link_pattern  (html only, required) Regex that article URLs on the listing page must fully match.
#   max_articles  (html only) Max article pages fetched per run (default 15).
#   ai_only       true (default) if the blog is AI-only. Set false for mixed-topic
#                 blogs so only posts matching AI keywords are kept.
#   category      "research", "product", or "auto" (default: classify each post by keywords).

# ---------------------------------------------------------------- Big tech ---

