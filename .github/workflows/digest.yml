name: AI News Digest

# GitHub cron only supports UTC, so the scheduled job runs once per week and
# starts at Saturday 19:30 UTC (Sunday 01:00 IST) and checks that cutoff is due.
# Each digest with new posts is opened as a GitHub issue assigned to the repo
# owner, which triggers a GitHub email notification.
# Delivered digests are committed under digests/, which marks them as sent so
# each digest goes out exactly once even if a run is delayed or retried.
on:
  schedule:
    - cron: "30 19 * * 6"
  workflow_dispatch:
    inputs:
      period:
        description: "'scheduled' sends the weekly digest if due; 'weekly' sends now"
        type: choice
        options: [scheduled, weekly]
        default: scheduled

concurrency:
  group: ai-news-digest
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore summary cache
        id: summary-cache
        uses: actions/cache/restore@v4
        with:
          path: .summary-cache
          key: summaries-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            summaries-v1-${{ github.ref_name }}-

      - name: Build digests
        id: build
        env:
          PERIOD: ${{ inputs.period || 'scheduled' }}
          DIGEST_TIMEZONE: Asia/Kolkata
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-nano' }}
          SUMMARY_INTERVAL_SECONDS: ${{ vars.SUMMARY_INTERVAL_SECONDS || '60' }}
        run: |
          # Manual weekly sends go to a temp dir so they don't mark the scheduled digest as sent.
          output_dir=digests
          if [ "$PERIOD" != "scheduled" ]; then output_dir="$RUNNER_TEMP/manual-digests"; fi
          python -m news_aggregator --period "$PERIOD" --output-dir "$output_dir" \
            --send-hour 1 --weekly-day sunday \
            --summarize --summary-model "$OPENAI_MODEL" \
            --summary-interval-seconds "$SUMMARY_INTERVAL_SECONDS"

      - name: Save summary cache even if generation fails
        if: always() && steps.summary-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .summary-cache
          key: ${{ steps.summary-cache.outputs.cache-primary-key }}

      - name: Persist scheduled digest snapshot
        if: success() && (inputs.period == '' || inputs.period == 'scheduled') && steps.build.outputs.snapshot_path != ''
        env:
          SNAPSHOT_PATH: ${{ steps.build.outputs.snapshot_path }}
        run: |
          git add "$SNAPSHOT_PATH"
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Persist scheduled AI news digest snapshot"
          git pull --rebase
          git push

      - name: Open notification issues
        if: success() && steps.build.outputs.nonempty_digest_paths != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST_PATHS: ${{ steps.build.outputs.nonempty_digest_paths }}
          OWNER: ${{ github.repository_owner }}
          PERIOD: ${{ inputs.period || 'scheduled' }}
        run: python -m news_aggregator.publisher

      - name: Commit delivered digests
        env:
          PERIOD: ${{ inputs.period || 'scheduled' }}
          SNAPSHOT_PATH: ${{ steps.build.outputs.snapshot_path }}
        run: |
          if [ "$PERIOD" = "scheduled" ] && [ -n "$SNAPSHOT_PATH" ]; then
            rm -f -- "$SNAPSHOT_PATH"
          fi
          [ -d digests ] || { echo "Nothing to commit."; exit 0; }
          git add -A digests
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add AI news digest(s): $(git diff --cached --name-only | xargs)"
          git pull --rebase
          git push
