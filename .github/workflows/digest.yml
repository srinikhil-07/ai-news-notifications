name: AI News Digest

# GitHub cron only supports UTC, so the scheduled job runs once per week and
# checks whether Sunday 08:00 in the DIGEST_TIMEZONE repository variable is due.
# Each digest with new posts is opened as a GitHub issue assigned to the repo
# owner, which triggers a GitHub email notification.
# Delivered digests are committed under digests/, which marks them as sent so
# each digest goes out exactly once even if a run is delayed or retried.
# Reader feedback from earlier digest issues is synced into feedback/ first and
# used to rank the new digest. LLM summaries are used when the LLM_API_KEY
# secret is set (any OpenAI-compatible endpoint; see README).
on:
  schedule:
    - cron: "5 8 * * 0"
  workflow_dispatch:
    inputs:
      period:
        description: "'scheduled' sends the weekly digest if due; 'weekly' sends now"
        type: choice
        options: [scheduled, weekly]
        default: scheduled

concurrency:
  group: ai-news-digest
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Article text and LLM summaries are cached between runs, never committed.
      - uses: actions/cache@v4
        with:
          path: .cache/news_aggregator
          key: news-cache-${{ github.run_id }}
          restore-keys: news-cache-

      # Fallback for feedback.yml: re-read recent digest issues before ranking.
      - name: Sync reader feedback
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          FEEDBACK_USERS: ${{ vars.FEEDBACK_USERS }}
        run: python -m news_aggregator.feedback sync

      - name: Build digests
        id: build
        env:
          PERIOD: ${{ inputs.period || 'scheduled' }}
          DIGEST_TIMEZONE: ${{ vars.DIGEST_TIMEZONE || 'UTC' }}
          DIGEST_RANKED: ${{ vars.DIGEST_RANKED || 'true' }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_ENDPOINT: ${{ vars.LLM_ENDPOINT }}
          LLM_MAX_CALLS: ${{ vars.LLM_MAX_CALLS }}
        run: |
          # Manual weekly sends go to a temp dir so they don't mark the scheduled digest as sent.
          output_dir=digests
          if [ "$PERIOD" != "scheduled" ]; then output_dir="$RUNNER_TEMP/manual-digests"; fi
          # Without LLM_API_KEY the ranked digest is built from excerpts and keyword tags.
          extra=()
          if [ "$DIGEST_RANKED" = "true" ]; then extra+=(--ranked --fetch-content); else LLM_PROVIDER=none; fi
          LLM_PROVIDER="$LLM_PROVIDER" python -m news_aggregator --period "$PERIOD" --output-dir "$output_dir" \
            --issue-dir "$RUNNER_TEMP/issues" "${extra[@]}"

      - name: Open notification issues
        if: steps.build.outputs.nonempty_digest_paths != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST_PATHS: ${{ steps.build.outputs.nonempty_digest_paths }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh label create ai-news --color 1D76DB --description "AI news digests" 2>/dev/null || true
          for path in $DIGEST_PATHS; do
            title="$(head -n 1 "$path" | sed 's/^# //') — $(basename "$path" .md)"
            # GitHub issue bodies are limited to 65536 characters. Ranked digests come with an
            # issue-sized body (shortened summaries + link to the committed digest).
            issue_body="$RUNNER_TEMP/issues/$(basename "$path")"
            if [ -f "$issue_body" ]; then cp "$issue_body" "$RUNNER_TEMP/body.md"; else head -c 60000 "$path" > "$RUNNER_TEMP/body.md"; fi
            # Assigning the owner guarantees a notification email; fall back if the owner is an org.
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md" --label ai-news --assignee "$OWNER" \
              || gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md" --label ai-news
          done

      - name: Commit delivered digests and feedback
        env:
          GH_TOKEN: ${{ github.token }}
          FEEDBACK_USERS: ${{ vars.FEEDBACK_USERS }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d digests ]; then
            git add digests
            git diff --cached --quiet || git commit -m "Add AI news digest(s): $(git diff --cached --name-only | xargs)"
          fi
          # feedback/ is recomputed on top of the latest branch (sync is idempotent), so a
          # concurrent feedback.yml run never causes a merge conflict.
          git checkout -- feedback 2>/dev/null || true
          git clean -fdq feedback 2>/dev/null || true
          for attempt in 1 2 3; do
            git pull --rebase -q origin "$BRANCH"
            python -m news_aggregator.feedback sync || true
            git add feedback
            committed=false
            if ! git diff --cached --quiet; then git commit -qm "Update reader feedback"; committed=true; fi
            if git push -q origin "HEAD:$BRANCH"; then exit 0; fi
            # Drop our feedback commit; it is recomputed after the next pull.
            if [ "$committed" = true ]; then git reset -q --hard HEAD~1; fi
            sleep $((attempt * 5))
          done
          exit 1
