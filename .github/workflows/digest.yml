name: AI News Digest

# GitHub cron only supports UTC, so this runs hourly and the aggregator decides
# what is due in the DIGEST_TIMEZONE repository variable (default UTC):
#   - daily digest (previous 24 hours) every day at 08:00 local time
#   - weekly digest (previous 7 days) every Sunday at 08:00 local time
# Delivered digests are committed under digests/, which marks them as sent so
# each email goes out exactly once even if a run is delayed or retried.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      period:
        description: "'scheduled' sends whatever is due; daily/weekly send now"
        type: choice
        options: [scheduled, daily, weekly]
        default: scheduled

concurrency:
  group: ai-news-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and email digests
        id: build
        env:
          PERIOD: ${{ inputs.period || 'scheduled' }}
          DIGEST_TIMEZONE: ${{ vars.DIGEST_TIMEZONE || 'UTC' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          # Manual daily/weekly sends go to a temp dir so they don't mark the scheduled digest as sent.
          output_dir=digests
          if [ "$PERIOD" != "scheduled" ]; then output_dir="$RUNNER_TEMP/manual-digests"; fi
          python -m news_aggregator --period "$PERIOD" --email --output-dir "$output_dir"

      - name: Commit delivered digests
        if: ${{ !cancelled() }}
        run: |
          [ -d digests ] || { echo "Nothing to commit."; exit 0; }
          git add digests
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add AI news digest(s): $(git diff --cached --name-only | xargs)"
          git pull --rebase
          git push
