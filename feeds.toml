# AI news sources from tech company blogs.
#
# Each [[feeds]] entry needs a `name` and an RSS/Atom `url`.
# Set `ai_only = false` for general-purpose blogs so that only posts matching
# AI-related keywords are included in the digest.

[[feeds]]
name = "OpenAI"
url = "https://openai.com/news/rss.xml"

[[feeds]]
name = "Google DeepMind"
url = "https://deepmind.google/blog/rss.xml"

[[feeds]]
name = "Google Research"
url = "https://research.google/blog/rss/"

[[feeds]]
name = "Google AI (The Keyword)"
url = "https://blog.google/technology/ai/rss/"

[[feeds]]
name = "Microsoft Research"
url = "https://www.microsoft.com/en-us/research/feed/"
ai_only = false

[[feeds]]
name = "Meta Engineering (ML)"
url = "https://engineering.fb.com/category/ml-applications/feed/"

[[feeds]]
